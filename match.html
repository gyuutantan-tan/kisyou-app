<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マッチング相手</title>

<style>

body{
    background:#f7f7f7;
    font-family:"Yu Gothic",sans-serif;
    display:flex;
    justify-content:center;
}

.phone{
    width:95%;
    max-width:380px;
    min-height:100vh;
    background:white;
    border-radius:30px;
    padding:20px;
    box-sizing:border-box;
}

.icon{
    width:120px;
    height:120px;
    background:#ddd;
    border-radius:50%;
    margin:auto;
}

h2{
    text-align:center;
}

.info{
    background:#f7f7f7;
    padding:15px;
    border-radius:15px;
    margin-top:20px;
}

.home-btn{
    display:block;
    margin-top:80px;
    text-align:center;
    text-decoration:none;
    background:#ff8eb3;
    color:white;
    padding:15px;
    border-radius:30px;
}

</style>
</head>

<body>

<div class="phone">

<div class="icon"></div>

<h2>佐賀大学生</h2>

<div class="info">
大学：佐賀大学
</div>

<div class="info">
起床時間：7:00
</div>

<div class="info">
連続起床日数：15日
</div>

<div class="info">
メッセージ：毎朝一緒に頑張りましょう！
</div>

<a href="index.html" class="home-btn">
ホームに戻る
</a>

</div>

</div>

</body>
</html>
