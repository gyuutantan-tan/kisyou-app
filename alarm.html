<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アラーム音</title>

<style>
body{
    background:#f7f7f7;
    font-family:"Yu Gothic",sans-serif;
    display:flex;
    justify-content:center;
}

.phone{
    width:95%;
    max-width:380px;
    min-height:100vh;
    background:white;
    border-radius:30px;
    padding:20px;
}

.sound{
    background:#f5f5f5;
    padding:20px;
    border-radius:15px;
    margin:15px 0;
}
</style>
</head>
<body>

<div class="phone">

<h2>アラーム音を選ぶ</h2>

<div class="sound"
onclick="playSound('Tritsch_Tratsch_Polka-Xy02-mp3/Tritsch_Tratsch_Polka-Xy02-1(Fast).mp3')">
🎵 朝のメロディ
</div>
<div class="sound">🐦 蚊</div>
<div class="sound">⏰ ベーシックアラーム</div>
<div class="sound">🎹 ピアノ</div>

<a href="point.html">戻る</a>

</div>

<script>

function playSound(file){

    console.log(file);

    const audio = new Audio(file);

    audio.play().catch(error => {
        console.error(error);
    });

}

</script>

</body>
</html>
